<style>
  :root {
    --ink: #FFFFFF;
    --soft: rgba(255, 255, 255, .74);
    --display: "Bricolage Grotesque", "Hind Siliguri", system-ui, sans-serif;
    --body: "Hind Siliguri", "Bricolage Grotesque", system-ui, sans-serif;
    color-scheme: dark;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { background: #04154F; scroll-behavior: smooth; }
  body {
    margin: 0;
    color: var(--ink);
    font-family: var(--body);
    font-size: 1.0625rem;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 3px solid #fff; outline-offset: 3px; border-radius: 12px; }

  /* Background the glass sits on */
  .bg {
    position: fixed; inset: 0; z-index: -1;
    background:
      radial-gradient(60% 38% at 14% 8%, rgba(90, 200, 255, .6), transparent 70%),
      radial-gradient(55% 38% at 92% 34%, rgba(150, 100, 255, .5), transparent 70%),
      radial-gradient(70% 45% at 18% 96%, rgba(0, 130, 255, .55), transparent 70%),
      linear-gradient(170deg, #04154F 0%, #0A35C4 55%, #1A5CF0 100%);
  }

  /* Liquid glass */
  .glass {
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,.26) 0%, rgba(255,255,255,.07) 55%, rgba(255,255,255,.14) 100%);
    -webkit-backdrop-filter: blur(20px) saturate(170%);
    backdrop-filter: blur(20px) saturate(170%);
    border: 1px solid rgba(255, 255, 255, .34);
    box-shadow:
      inset 0 1px 1px rgba(255, 255, 255, .65),
      inset 0 -1px 1px rgba(255, 255, 255, .16),
      0 12px 32px rgba(0, 12, 70, .38);
  }
  .glass::before {
    content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit; pointer-events: none;
    background: radial-gradient(120% 60% at 28% 0%, rgba(255,255,255,.34), transparent 62%);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    .glass { background: rgba(20, 60, 170, .6); }
  }

  .page { max-width: 540px; margin: 0 auto; padding: calc(40px + env(safe-area-inset-top, 0px)) 18px 170px; }
  section { scroll-margin-top: 16px; }

  /* Profile */
  .profile { text-align: center; }
  .avatar-ring { display: block; width: 132px; height: 132px; margin: 0 auto 18px; padding: 7px; border-radius: 50%; }
  .avatar { display: block; width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: rgba(255,255,255,.15); }
  .profile h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: clamp(2rem, 8vw, 2.6rem); line-height: 1.25; }
  .social-name { margin: 6px 0 0; font-weight: 600; font-size: 1.2rem; }
  .handle { display: inline-block; margin: 8px 0 0; padding: 2px 16px; border-radius: 999px; font-family: var(--display); font-size: .98rem; }
  .bio { margin: 16px auto 0; max-width: 36ch; color: var(--soft); }

  /* App icons */
  .icons { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 26px 10px; margin-top: 34px; }
  .app {
    display: flex; flex-direction: column; align-items: center; gap: 9px;
    color: var(--ink); text-decoration: none;
    animation: pop 560ms cubic-bezier(.2, .9, .3, 1.2) backwards;
    animation-delay: calc(var(--i) * 80ms);
    transition: transform 120ms ease;
  }
  .app:active { transform: scale(.92); }
  .icon {
    display: grid; place-items: center; width: 68px; height: 68px; border-radius: 22px;
    background:
      radial-gradient(circle at 30% 18%, var(--tint, rgba(255,255,255,.3)), transparent 78%),
      linear-gradient(145deg, rgba(255,255,255,.26), rgba(255,255,255,.07));
    animation: bob 3.6s ease-in-out infinite;
  }
  .icon svg { display: block; width: 36px; height: 36px; }
  .app-label { font-size: .85rem; color: var(--soft); line-height: 1.2; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

  /* Panels */
  .panel { margin-top: 34px; padding: 22px 18px; border-radius: 30px; }
  .panel h2 { margin: 0 0 16px; font-family: var(--display); font-weight: 700; font-size: 1.3rem; line-height: 1.3; }

  /* Videos */
  .videos { display: grid; gap: 22px; }
  .video { display: block; color: var(--ink); text-decoration: none; }
  .thumb {
    position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 20px; overflow: hidden;
    background: rgba(255, 255, 255, .12); border: 1px solid rgba(255, 255, 255, .3);
  }
  .thumb img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .play {
    position: absolute; inset: 0; margin: auto; width: 58px; height: 58px; border-radius: 50%;
    display: grid; place-items: center;
  }
  .play svg { width: 22px; height: 22px; margin-left: 3px; }
  .vtitle { display: block; margin-top: 10px; font-weight: 600; line-height: 1.45; }

  /* Works */
  .works { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { display: block; width: 100%; aspect-ratio: 1; padding: 5px; border-radius: 22px; overflow: hidden; cursor: pointer; }
  .tile img { display: block; width: 100%; height: 100%; object-fit: cover; border-radius: 17px; }
  .tile.empty { display: grid; place-items: center; padding: 12px; color: var(--soft); font-size: .95rem; text-align: center; cursor: default; }

  /* About */
  .about-p { margin: 0 0 14px; max-width: 60ch; }
  .w { display: inline-block; opacity: 0; transform: translateY(8px); filter: blur(6px);
       transition: opacity .55s ease, transform .55s ease, filter .55s ease; }
  .in .w { opacity: 1; transform: none; filter: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 10px; margin: 20px 0 26px; }
  .chip { padding: 4px 16px; border-radius: 999px; font-size: .95rem; opacity: 0; transform: scale(.8);
          transition: opacity .4s ease, transform .4s cubic-bezier(.2, .9, .3, 1.3); }
  .in .chip { opacity: 1; transform: none; }
  .wa-btn {
    display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%;
    padding: 14px 20px; border-radius: 999px; color: #fff; text-decoration: none; font-weight: 600; font-size: 1.05rem;
    background:
      radial-gradient(circle at 30% 0%, rgba(37, 211, 102, .95), transparent 85%),
      linear-gradient(145deg, rgba(37, 211, 102, .6), rgba(37, 211, 102, .25));
    transition: transform 120ms ease;
  }
  .wa-btn:active { transform: scale(.97); }
  .wa-btn svg { width: 26px; height: 26px; }

  footer { margin-top: 34px; text-align: center; color: var(--soft); font-size: .9rem; }

  /* Floating dock */
  .dock {
    position: fixed; left: 50%; transform: translateX(-50%); z-index: 10;
    width: min(100% - 24px, 520px); display: flex; gap: 10px;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
  }
  .pill { flex: 1; display: flex; gap: 2px; padding: 6px; border-radius: 999px; }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 1px;
    padding: 7px 4px 6px; border-radius: 999px; color: var(--ink); text-decoration: none;
    font-size: .74rem; line-height: 1.3; opacity: .8;
    transition: background .25s ease, opacity .25s ease, box-shadow .25s ease;
  }
  .tab svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tab.active { opacity: 1; background: rgba(255, 255, 255, .24); box-shadow: inset 0 1px 1px rgba(255, 255, 255, .55); }
  .round {
    flex: none; display: grid; place-items: center; width: 66px; height: 66px; border-radius: 50%;
    background:
      radial-gradient(circle at 30% 10%, rgba(37, 211, 102, .95), transparent 85%),
      linear-gradient(145deg, rgba(37, 211, 102, .6), rgba(37, 211, 102, .25));
    transition: transform 120ms ease;
  }
  .round:active { transform: scale(.94); }
  .round svg { width: 32px; height: 32px; }

  /* Lightbox */
  dialog { color: var(--ink); border-radius: 26px; padding: 12px; max-width: 96vw; }
  dialog::backdrop { background: rgba(2, 10, 45, .75); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
  #lightbox img { display: block; max-width: 100%; max-height: 74vh; margin: 0 auto; border-radius: 18px; }
  #lightbox p { margin: 10px 0 12px; text-align: center; color: var(--soft); }
  #lightbox .close { display: block; margin: 0 auto; padding: 8px 26px; border-radius: 999px; cursor: pointer; font-weight: 600; }

  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .app, .icon { animation: none; }
    .w, .chip { opacity: 1; transform: none; filter: none; transition: none; }
  }
</style>
</head>

    telegram: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M52 14L11 30.5l11.5 4.2L47 19 29 38l-1.2 12 7.8-8L46 50z" fill="#fff"/></svg>',
    whatsapp: WA_GLYPH,
    link: '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M27 37l10-10M23.5 33l-3.5 3.5a8.5 8.5 0 0 0 12 12l3.5-3.5M40.5 31l3.5-3.5a8.5 8.5 0 0 0-12-12L28.5 19" stroke="#fff" stroke-width="4.5" fill="none" stroke-linecap="round"/></svg>'
  };
  var TINTS = {
    youtube: "rgba(255,45,45,.7)", facebook: "rgba(24,119,242,.75)", instagram: "rgba(232,60,140,.7)",
    tiktok: "rgba(37,244,238,.5)", telegram: "rgba(39,167,231,.75)", whatsapp: "rgba(37,211,102,.7)", link: "rgba(255,207,63,.65)"
  };
  CONFIG.socials.forEach(function (s, i) {
    var li = el("li");
    var a = el("a", "app");
    a.href = (s.type === "whatsapp" && (!s.url || s.url === "#")) ? waUrl : s.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    a.style.setProperty("--i", i);
    a.setAttribute("aria-label", s.label);
    var ic = el("span", "icon glass");
    ic.style.setProperty("--tint", TINTS[s.type] || TINTS.link);
    ic.style.animationDelay = (-i * 0.55) + "s";
    ic.innerHTML = ICONS[s.type] || ICONS.link;
    a.appendChild(ic);
    a.appendChild(el("span", "app-label", s.label));
    li.appendChild(a);
    $("icons").appendChild(li);
  });

  /* ---------- ভিডিও ---------- */
  function ytId(url) {
    var m = /(?:youtu\.be\/|v=|shorts\/|embed\/)([\w-]{11})/.exec(url || "");
    return m ? m[1] : null;
  }
  var PLAY = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17l14-8.5z" fill="#fff"/></svg>';
  if (!CONFIG.videos.length) { $("videos").hidden = true; }
  CONFIG.videos.forEach(function (v) {
    var li = el("li");
    var a = el("a", "video");
    a.href = v.url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    var thumb = el("span", "thumb");
    var id = ytId(v.url);
    var src = v.thumb || (id ? "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg" : null);
    if (src) {
      var img = el("img");
      img.loading = "lazy";
      img.alt = "";
      img.onerror = function () { img.remove(); };
      img.src = src;
      thumb.appendChild(img);
    }
    var play = el("span", "play glass");
    play.innerHTML = PLAY;
    thumb.appendChild(play);
    a.appendChild(thumb);
    a.appendChild(el("span", "vtitle", v.title));
    li.appendChild(a);
    $("videoList").appendChild(li);
  });

  /* ---------- কাজের নমুনা ---------- */
  var lb = $("lightbox");
  if (!CONFIG.works.length) { $("works").hidden = true; }
  CONFIG.works.forEach(function (w) {
    var li = el("li");
    var btn = el("button", "tile glass");
    btn.type = "button";
    btn.setAttribute("aria-label", w.title + " বড় করে দেখুন");
    var img = el("img");
    img.loading = "lazy";
    img.alt = w.title;
    img.onerror = function () {
      li.innerHTML = "";
      li.appendChild(el("div", "tile empty glass", w.title));
    };
    img.src = w.src;
    btn.appendChild(img);
    btn.addEventListener("click", function () {
      $("lbImg").src = w.src;
      $("lbImg").alt = w.title;
      $("lbCap").textContent = w.title;
      lb.showModal();
    });
    li.appendChild(btn);
    $("workList").appendChild(li);
  });
  $("lbClose").addEventListener("click", function () { lb.close(); });
  lb.addEventListener("click", function (e) { if (e.target === lb) lb.close(); });

  /* ---------- আমার সম্পর্কে (অ্যানিমেটেড) ---------- */
  $("aboutTitle").textContent = CONFIG.about.title;
  var n = 0;
  CONFIG.about.paragraphs.forEach(function (text) {
    var p = el("p", "about-p");
    text.split(" ").forEach(function (word) {
      if (!word) return;
      var s = el("span", "w", word);
      s.style.transitionDelay = Math.min(n * 35, 1800) + "ms";
      n++;
      p.appendChild(s);
      p.appendChild(document.createTextNode(" "));
    });
    $("aboutText").appendChild(p);
  });
  CONFIG.about.chips.forEach(function (c, i) {
    var li = el("li", "chip glass", c);
    li.style.transitionDelay = (Math.min(n * 35, 1800) + 150 + i * 90) + "ms";
    $("chips").appendChild(li);
  });
  var about = $("about");
  if (reduce || !("IntersectionObserver" in window)) {
    about.classList.add("in");
  } else {
    var revealer = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (en.isIntersecting) { about.classList.add("in"); revealer.disconnect(); }
      });
    }, { threshold: 0.25 });
    revealer.observe(about);
  }

  /* ---------- নিচের মেনু: কোন অংশে আছেন তা চিহ্নিত ---------- */
  var tabs = Array.prototype.slice.call(document.querySelectorAll(".tab"));
  tabs.forEach(function (t) {
    if (!$(t.getAttribute("data-target")) || $(t.getAttribute("data-target")).hidden) t.hidden = true;
  });
  if ("IntersectionObserver" in window) {
    var spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (en) {
        if (!en.isIntersecting) return;
        tabs.forEach(function (t) {
          t.classList.toggle("active", t.getAttribute("data-target") === en.target.id);
        });
      });
    }, { rootMargin: "-45% 0px -50% 0px" });
    ["home", "videos", "works", "about"].forEach(function (id) {
      var s = $(id);
      if (s && !s.hidden) spy.observe(s);
    });
  }
})();
</script>
</body>
</html>
